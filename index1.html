<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intan Permata Wardhaningsih</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      color: #fff;
      overflow: hidden;
    }

    /* NAVIGATION MENU */
    nav {
      position: fixed;
      top: 0;
      right: 0;
      padding: 15px 30px;
      z-index: 10;
    }

    .menu {
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      user-select: none;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 12px;
      border-radius: 8px;
      transition: background 0.3s;
    }

    .menu:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Dropdown */
    .dropdown {
      display: none;
      position: absolute;
      top: 50px;
      right: 30px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      overflow: hidden;
      min-width: 150px; /* 🔧 tambahkan ini supaya cukup lebar */

    }

    .dropdown a {
      display: block;
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      font-size: 0.9rem;
      transition: background 0.3s, color 0.3s;
    }

    .dropdown a:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffdcdc;
    }

    .show {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* HERO SECTION */
    .hero {
      height: 100vh;
      background: url('assets/bghome.png') center/cover no-repeat;
      display: flex;
      align-items: center;
      position: relative;
      padding-left: 8%;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      color: #fff;
      max-width: 600px;
      text-align: left;
    }

    .hero h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      animation: fadeInDown 1.5s ease;
    }

    .hero p {
      font-size: 1.2rem;
      font-weight: 400;
      margin-bottom: 2rem;
      animation: fadeInUp 1.8s ease;
    }

    .read-more {
      background-color: white;
      color: #333;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .read-more:hover {
      background-color: #f5f5f5;
      transform: scale(1.05);
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .menu {
        font-size: 0.9rem;
        padding: 5px 10px;
      }
      .dropdown a {
        font-size: 0.85rem;
        padding: 8px 15px;
      }
      .hero {
        padding-left: 5%;
        justify-content: center;
      }
      .hero h1 {
        font-size: 2.3rem;
      }
      .hero p {
        font-size: 1rem;
      }
      .read-more {
        padding: 0.6rem 1.5rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <!-- NAVIGATION -->
  <nav>
    <div class="menu" onclick="toggleDropdown()">☰</div>
    <div class="dropdown" id="dropdownMenu">
      <a href="portofolio.html">Portfolio</a>
      <a href="sosial.html">Social Links</a>
      <a href="produk.html">Product</a>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero-content">
      <h1>Intan Permata Wardhaningsih</h1>
      <p>Sarjana Terapan Teknik Telekomunikasi</p>
      <button class="read-more" onclick="goToAbout()">Read More</button>
    </div>
  </section>

  <script>
    function toggleDropdown() {
      document.getElementById("dropdownMenu").classList.toggle("show");
    }

    function goToAbout() {
      window.location.href = "portofolio.html";
    }

    // Tutup dropdown jika klik di luar area menu
    window.onclick = function(event) {
      if (!event.target.matches('.menu')) {
        let dropdowns = document.getElementsByClassName("dropdown");
        for (let i = 0; i < dropdowns.length; i++) {
          let openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }
  </script>

</body>
</html>
